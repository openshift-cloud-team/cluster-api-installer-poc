apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AzureStackHCIMachine
metadata:
  name: ${INFRA_ID}-bootstrap
  namespace: capi-guests
  labels:
    cluster.x-k8s.io/cluster-name: ${INFRA_ID}
    cluster.x-k8s.io/control-plane: ""
spec:
  vmSize: ${BOOTSTRAP_VM_SIZE}
  location: ${LOCATION}
  # Must be base64 encoded: the reconciler runs base64.StdEncoding.DecodeString() over this field
  # and fails the machine if it does not decode.
  sshPublicKey: ${SSH_PUBLIC_KEY_B64}
  storageContainer: ${STORAGE_CONTAINER}
  allocatePublicIP: false
  image:
    # Per-cluster gallery image with bootstrap.ign already written to /boot/ignition/config.ign.
    # Built and uploaded by create-cluster.sh.
    name: ${BOOTSTRAP_IMAGE_NAME}
    osType: Linux
  osDisk:
    # Only osType is honoured. generateStorageProfile() derives the OS disk URI from the VM name
    # and never reads name, source or diskSizeGB, but the CRD requires all four to be present.
    name: ${INFRA_ID}-bootstrap-osdisk
    source: ""
    osType: Linux
    diskSizeGB: 120
  # availabilityZone is deliberately omitted. isAvailabilityZoneSupported() matches spec.location
  # against a hardcoded list of ten Azure public region names, and when it matches the reconciler
  # dereferences spec.availabilityZone.Enabled without a nil check. Keep ${LOCATION} off that list.
